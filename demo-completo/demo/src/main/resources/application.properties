spring.application.name=demo

# ---------------------------------------------------------
# Banco de dados
# Por padrao a aplicacao roda com H2 em memoria (nao precisa
# instalar nada). Para usar MySQL, defina DB_URL/DB_USERNAME/DB_PASSWORD
# como variaveis de ambiente e ajuste spring.datasource.url abaixo.
# ---------------------------------------------------------
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:demo_db
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2, util para inspecionar os usuarios cadastrados em dev:
# http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:demo_db)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------
# Envio de e-mail (recuperacao de senha)
# Nao versionamos credenciais reais: configure MAIL_USERNAME e
# MAIL_PASSWORD como variaveis de ambiente antes de rodar a aplicacao
# se quiser o envio de e-mail funcionando de verdade. Sem elas, o link
# de recuperacao fica registrado no log do console (veja EmailService).
# ---------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=${APP_BASE_URL:http://localhost:8080}
