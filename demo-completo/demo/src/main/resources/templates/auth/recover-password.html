<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jornada - Recuperar senha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

  <div class="viewport">
    <div id="particles-container"></div>

    <svg class="landscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="rgba(168, 195, 178, 0.25)" d="M0,224L60,213.3C120,203,240,181,360,186.7C480,192,600,224,720,218.7C840,213,960,171,1080,165.3C1200,160,1320,192,1380,208L1440,224L1440,320L0,320Z"></path>
      <path fill="rgba(142, 173, 154, 0.2)" d="M0,256L80,245.3C160,235,320,213,480,224C640,235,800,277,960,272C1120,267,1280,213,1360,186.7L1440,160L1440,320L0,320Z"></path>
    </svg>

    <div class="login-container">
      <div class="header">
        <h1>Recuperar senha</h1>
        <p>Informe o e-mail cadastrado para receber o link de redefinição.</p>
      </div>

      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

      <form th:action="@{/recoverpassword}" th:object="${recoverPasswordForm}" method="post">
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" th:field="*{email}"
                 th:classappend="${#fields.hasErrors('email')} ? 'input-error'"
                 placeholder="seuemail@exemplo.com" autocomplete="off">
          <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="actions">
          <button type="submit" class="btn-submit">Enviar link</button>
        </div>

        <div class="footer-links">
          <a th:href="@{/login}">Voltar ao login</a>
        </div>
      </form>
    </div>
  </div>

  <script th:src="@{/js/particles.js}"></script>
</body>
</html>
